[package]
name = "vizcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VizCraft: an open-source business intelligence studio (Power BI + Tableau + Fabric) in pure Rust"

[lints]
workspace = true

[[bin]]
name = "vizcraft"
path = "src/main.rs"

[dependencies]
vizcraft-core = { workspace = true }
vizcraft-datamodel = { workspace = true }
vizcraft-query = { workspace = true }
vizcraft-connectors = { workspace = true }
vizcraft-publish = { workspace = true }
# Embedded analytical SQL (DuckDB, compiled from source by the `duckdb` feature, on by default).
vizcraft-sql = { workspace = true, features = ["duckdb"] }
vizcraft-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
