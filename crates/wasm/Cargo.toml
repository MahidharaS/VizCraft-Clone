[package]
name = "vizardcraft-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VizardCraft engine for the web viewer: core compiled to wasm32-unknown-unknown with a small C-ABI JSON API"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The C ABI needs `#[unsafe(no_mangle)]` and raw pointers: this crate alone allows unsafe code.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
vizardcraft-core = { workspace = true }
vizardcraft-publish = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
vizardcraft-query = { workspace = true }
